<!doctype html>
<html lang="fr-CA" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Qualité CG</title>
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout : rail de navigation à gauche (bandeau défilant sur téléphone), contenu opérationnel à droite, tiroir de détail pour un constat. Charte Somtech. */
:root{
  /* jetons Somtech, mode jour */
  --pine:#4C7334; --pine-2:#618E43; --pine-soft:#EEF2EB;
  --amber:#D97706; --amber-deep:#B45309;
  --concrete:#F9FAFB; --surface:#FFFFFF; --surface-2:#F3F4F6;
  --ink:#111827; --muted:#6B7280; --line:#E5E7EB; --line-strong:#D1D5DB;
  --ok:#15803D; --warn:#B45309; --bad:#B91C1C;
  --radius:12px;
  /* alias internes */
  --bg:var(--concrete); --accent:var(--pine); --accent-ink:#FFFFFF; --accent-soft:var(--pine-soft);
  --crit:var(--bad); --neutral:var(--muted); --stripe:var(--amber);
  --f-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --pine:#A6D083; --pine-2:#8FBF6E; --pine-soft:#1D2A16;
  --amber:#FCD34D; --amber-deep:#FCD34D;
  --concrete:#0F1115; --surface:#171A1F; --surface-2:#1F242B;
  --ink:#F3F4F6; --muted:#9CA3AF; --line:#2A2F37; --line-strong:#3A414B;
  --ok:#4ADE80; --warn:#FCD34D; --bad:#F87171; --accent-ink:#0F1115; color-scheme:dark}}
:root[data-theme="dark"]{
  --pine:#A6D083; --pine-2:#8FBF6E; --pine-soft:#1D2A16;
  --amber:#FCD34D; --amber-deep:#FCD34D;
  --concrete:#0F1115; --surface:#171A1F; --surface-2:#1F242B;
  --ink:#F3F4F6; --muted:#9CA3AF; --line:#2A2F37; --line-strong:#3A414B;
  --ok:#4ADE80; --warn:#FCD34D; --bad:#F87171; --accent-ink:#0F1115; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;font-weight:800}
h3{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* bandeau prototype */
.proto{background:repeating-linear-gradient(-45deg,var(--stripe) 0 10px,var(--ink) 10px 20px);height:5px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.brand .tool{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-size:21px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:6px 16px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot)}
.seg .m-q{--dot:var(--pine)} .seg .m-s{--dot:var(--amber)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 12%,transparent)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.mini{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--pine)}
.seg.plain button::before{display:none}
.seg.plain button{padding:4px 12px}
a{color:var(--accent)}
.sig{display:flex;gap:6px;flex-wrap:wrap}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);background:var(--surface)}
.stepper button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-2);font-size:11px}
.stepper button[aria-current="step"]{border-color:var(--pine);color:var(--ink)}
.stepper button[aria-current="step"] .n{background:var(--pine);color:var(--accent-ink)}
.stepper button.done .n{background:var(--pine-soft);color:var(--pine)}
.stepper button:focus-visible{outline:2px solid var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fgrid label.full{grid-column:1/-1}
.disc-h td{background:var(--surface-2);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dec{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.dec button{all:unset;cursor:pointer;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.dec button+button{border-left:1px solid var(--line)}
.dec button[aria-pressed="true"].r{background:var(--pine-soft);color:var(--pine)}
.dec button[aria-pressed="true"].a{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber-deep)}
.dec button[aria-pressed="true"].x{background:var(--surface-2);color:var(--ink)}
.dec button:focus-visible{outline:2px solid var(--accent)}
.arret{display:inline-block;font-size:11px;font-weight:700;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);border-radius:4px;padding:0 5px;white-space:nowrap}
.chk{display:flex;flex-direction:column;gap:8px}
.chk div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:13px}
.chk .k{font-weight:700}
.chk .bad{color:var(--bad)} .chk .warn{color:var(--amber-deep)} .chk .good{color:var(--ok)}
@media (max-width:900px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.proto-tag{font-size:11px;font-weight:600;color:var(--amber-deep);background:color-mix(in srgb,var(--amber) 14%,transparent);border-radius:999px;padding:2px 8px}
.ctl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
select,input[type=text],input[type=date],textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toggle{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--muted)}

.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100% - 70px)}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
nav.side button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:var(--r);font-weight:500}
nav.side button:hover{background:var(--surface-2)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side button:focus-visible{outline:2px solid var(--accent)}
.count{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--muted)}
.count.hot{background:var(--crit);border-color:var(--crit);color:var(--surface)}

main{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:18px;max-width:1240px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted);max-width:68ch}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.panel>.tbl-wrap{border-radius:var(--radius)}
.btn{border-color:var(--line-strong)}
.btn.primary:hover{background:var(--pine-2);border-color:var(--pine-2);filter:none}
.panel>h3{margin-bottom:12px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:2fr 1fr}

.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--crit)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;
  background:color-mix(in srgb,var(--c,var(--neutral)) 14%,transparent);color:var(--c,var(--neutral))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-crit{--c:var(--crit)} .c-warn{--c:var(--warn)} .c-ok{--c:var(--ok)} .c-acc{--c:var(--accent)} .c-neu{--c:var(--neutral)}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.sev{width:4px;padding:0}
td.sev span{display:block;width:4px;min-height:38px;height:100%;background:var(--c)}
.late{color:var(--crit);font-weight:600}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:14px;background:var(--surface-2);border-radius:3px;display:flex;overflow:hidden}
.bar .track i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:-1px}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.li:last-child{border-bottom:0}
.li .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* tiroir */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);z-index:20}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:16px}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dhead h2{font-size:20px;margin-top:6px}
.meta{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:13px}
.meta dt{color:var(--muted)} .meta dd{margin:0}
.photo{border:1px dashed var(--line);border-radius:var(--r);padding:14px;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center}
.photo img{max-height:180px;border-radius:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.rule{font-size:13px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--ink);border-left:3px solid var(--warn);padding:8px 10px;border-radius:0 4px 4px 0}
.why{display:flex;flex-direction:column;gap:6px}
.why label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;font-size:13px}
.why label span{font-family:var(--f-mono);color:var(--muted)}
.journal{font-size:13px;display:flex;flex-direction:column;gap:6px}
.journal div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px}

/* synchro */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.step{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface-2);font-size:13px;display:flex;flex-direction:column;gap:4px}
.step b{font-family:var(--f-display);font-size:14px}
.step.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.step .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.form-card{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.form-card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.form-card li{display:flex;justify-content:space-between;gap:10px}
.yes{color:var(--ok);font-weight:600} .no{color:var(--crit);font-weight:600}

/* compétences */
.mx td,.mx th{text-align:center;white-space:nowrap}
.mx td:first-child,.mx th:first-child{text-align:left}
.cell{display:inline-block;min-width:64px;padding:3px 6px;border-radius:4px;font-family:var(--f-mono);font-size:12px}
.cell.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.cell.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.cell.bad{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit);font-weight:600}
.cell.none{color:var(--muted)}

.alert{display:flex;gap:12px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--crit) 45%,var(--line));background:color-mix(in srgb,var(--crit) 7%,var(--surface));border-radius:8px;padding:12px 14px;font-size:13px}
.alert b{display:block;font-size:14px}
.lock{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:36px 16px;color:var(--muted)}
.lock b{color:var(--ink);font-size:15px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}

/* modal */
.modal{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.modal label.full{grid-column:1/-1}
.modal .foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.scrim.m{z-index:30}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-weight:500;max-width:calc(100% - 32px)}

/* notes pour Somtech */
.dev{display:none;font-family:var(--f-mono);font-size:12px;line-height:1.5;background:var(--accent-soft);color:var(--ink);border:1px dashed var(--accent);border-radius:var(--r);padding:8px 10px}
.dev::before{content:"SOMTECH  ";color:var(--accent);font-weight:500;letter-spacing:.06em}
body.dev-on .dev{display:block}

.fab{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left,0px))}
  nav.side .grp{display:none}
  nav.side button{white-space:nowrap;gap:8px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .brand small{display:none}
  .hide-sm{display:none}
  .fab{display:inline-flex;position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;padding:12px 16px;border-radius:999px;box-shadow:0 4px 14px color-mix(in srgb,var(--ink) 30%,transparent)}
  .modal form{grid-template-columns:minmax(0,1fr)}
  .meta{grid-template-columns:minmax(0,1fr)} .meta dt{margin-top:6px}
  .bar{grid-template-columns:minmax(0,1fr) 34px} .bar .track{grid-column:1/-1;grid-row:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="proto" aria-hidden="true"></div>
<header class="top">
  <div class="brand">
    <div class="crumb"><svg width="16" height="17" viewBox="0 0 22 24" aria-hidden="true"><polygon points="11,1 21,6 11,11 1,6" fill="#8BC47B"/><polygon points="1,6 11,11 11,23 1,18" fill="#618E43"/><polygon points="21,6 11,11 11,23 21,18" fill="#4C7334"/></svg>Construction Gauthier · Opérations<span aria-hidden="true" style="margin:0 2px">›</span><span style="color:var(--ink);font-weight:600">Qualité</span></div>
    <div class="tool"><h1>Qualité</h1><span class="proto-tag" title="Rien n'est enregistré">Maquette · données fictives</span></div><div class="muted" style="font-size:13px">Non-conformités, demandes, audits et plan qualité (PIE), tous projets confondus.</div>
  </div>
  <button class="btn hide-sm" data-act="theme" id="themebtn">Mode nuit</button>
  <label class="ctl" for="role">Vue de <select id="role"></select></label>
  <label class="toggle hide-sm" for="devmode"><input type="checkbox" id="devmode"> Notes pour Somtech</label>
  <button class="btn primary hide-sm" data-act="new">+ Nouveau constat</button>
</header>
<div class="app">
  <nav class="side" id="nav" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<button class="btn primary fab" data-act="new">+ Constat</button>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- utilitaires ---------- */
const DAY=864e5, T0=new Date(); T0.setHours(0,0,0,0);
const d=n=>new Date(T0.getTime()+n*DAY);
const fmt=dt=>dt?dt.toLocaleDateString('fr-CA',{day:'numeric',month:'short'}):'';
const days=(a,b)=>Math.round((a-b)/DAY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const nowHM=()=>new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'});

/* ---------- données fictives ---------- */

function transitions(c){
  const u=S.role, r=c.resp, out=[]; let rule='';
  if(!r)return{out,rule:'Observation positive : aucune action requise.'};
  if(c.statut==='ouverte')out.push(['encours','Prendre en charge','']);
  if(c.statut==='encours'){
    if(isST(r))out.push(['averifier','Enregistrer la preuve reçue du portail','primary']);
    else if(u===r||u==='sg'||u==='dir')out.push(['averifier','Déposer la preuve de correction','primary']);
    else rule='Seul le responsable ou le surintendant dépose la preuve de correction.';
  }
  if(c.statut==='averifier'){
    if(u===r)rule='Tu es responsable de cette action : quelqu\'un d\'autre doit valider la fermeture. Change la vue en haut pour essayer.';
    else{out.push(['fermee','Valider la fermeture','primary']);out.push(['encours','Refuser, à reprendre',''])}
  }
  return{out,rule};
}

    </div></div>`:''}
    ${c.resp?`<div><h3 style="margin-bottom:8px">Compilation des coûts</h3><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
      <label class="ctl" style="flex-direction:column;align-items:flex-start" for="ch-${c.id}">Heures de reprise<input type="number" min="0" id="ch-${c.id}" data-cost="h" value="${c.cout.h}" style="width:110px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px"></label>
      <label class="ctl" style="flex-direction:column;align-items:flex-start" for="cm-${c.id}">Matériaux ($)<input type="number" min="0" id="cm-${c.id}" data-cost="mat" value="${c.cout.mat}" style="width:110px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px"></label>
      <label class="toggle" for="cr-${c.id}"><input type="checkbox" id="cr-${c.id}" data-cost="refact" ${c.cout.refact?'checked':''}> Refacturable${isST(c.resp)?' à '+esc(ST[c.resp].nom):''}</label></div>
      <p style="margin:8px 0 0;font-size:13px">Total : <b class="mono" id="ct-${c.id}">${costTxt(c)}</b> <span class="muted">(taux moyen ${TAUX} $/h, paramétrable)</span></p></div>`:''}
    <div><h3 style="margin-bottom:8px">Abonnés</h3><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${c.abonnes.map(k=>`<span class="tag" style="text-transform:none;letter-spacing:0;font-size:12px">${who(k)}<button data-act="abodel" data-k="${k}" aria-label="Retirer ${who(k)}" style="all:unset;cursor:pointer;margin-left:6px">×</button></span>`).join('')}
      <select id="abo-add" aria-label="Ajouter un abonné"><option value="">+ Ajouter</option>${Object.keys(PEOPLE).filter(k=>!c.abonnes.includes(k)).map(k=>`<option value="${k}">${PEOPLE[k].nom}</option>`).join('')}</select></div>
      <p class="muted" style="margin:6px 0 0;font-size:12px">Les abonnés reçoivent un avis à chaque changement d'étape.</p></div>
    ${c.statut==='fermee'&&c.resp?`<div><h3 style="margin-bottom:8px">Évaluation de l'efficacité</h3>${c.eff?`<span class="pill ${c.eff==='ok'?'c-ok':'c-crit'}">${c.eff==='ok'?'Efficace':'Non efficace'}</span>`:`<p style="margin:0 0 8px;font-size:13px">Prévue le ${fmt(new Date(c.fermeLe.getTime()+30*DAY))} : le problème est-il revenu ?</p><div class="actions"><button class="btn" data-act="effok" data-id="${c.id}">Efficace</button><button class="btn" data-act="effko" data-id="${c.id}">Non efficace, rouvrir</button></div>`}</div>`:''}
    <div><h3 style="margin-bottom:8px">Journal</h3><div class="journal">${c.journal.map(j=>`<div><span class="mono muted">${j.t}</span><span>${esc(j.txt)}</span></div>`).join('')}</div></div>
    ${dev('Tables constat + action + cause. Contrainte serveur : action.ferme_par ≠ action.responsable. Champs ajoutés : mesure_immediate, cause_5p, cause_6m, cout (heures × taux + matériaux, refacturable), abonnes, efficacite (vérifiée 30 j après fermeture ; « non efficace » rouvre l\'action). Chaque transition écrit dans journal. Le sous-traitant dépose sa preuve via le portail ; un interne l\'enregistre ici.')}
  </aside>`;
}

/* ---------- nouveau constat ---------- */
let draftPhoto=null;
function modal(){
  const o=(obj,f)=>Object.keys(obj).map(k=>`<option value="${k}">${f(k)}</option>`).join('');
  return `<div class="scrim m" data-act="closemodal"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Nouveau constat"><h2 style="font-size:19px">Nouveau constat ${S.mod==='q'?'qualité':'SST'}</h2>
  <p class="muted" style="margin:0;font-size:13px">Pensé pour le téléphone : une photo, une phrase, le reste se complète au bureau.</p>
  <form id="newf">
    <label>Projet<select id="n-projet">${o(PROJ,k=>k+' '+PROJ[k].nom)}</select></label>
    <label>Type<select id="n-type">${FAM[S.mod].map(k=>`<option value="${k}">${TYPES[k].l}</option>`).join('')}</select></label>
    <label class="full">Ce que tu as vu<input type="text" id="n-titre" required placeholder="Ex. garde-corps manquant, cage d'escalier A"></label>
    <label>Gravité<select id="n-grav">${o(GRAV,k=>GRAV[k].l)}</select></label>
    <label>Responsable<select id="n-resp"><optgroup label="Sous-traitants">${o(ST,k=>ST[k].nom)}</optgroup><optgroup label="CG">${o(PEOPLE,k=>PEOPLE[k].nom+', '+PEOPLE[k].role)}</optgroup></select></label>
    <label class="full">Photo<input type="file" id="n-photo" accept="image/*"></label>
    <p class="muted full" style="margin:0;font-size:12px;grid-column:1/-1" id="n-ech">Échéance calculée : ${fmt(d(GRAV.mineure.delai))} (mineure, 7 jours)</p>
    <div class="foot"><button type="button" class="btn" data-act="closemodal">Annuler</button><button type="submit" class="btn primary">Créer le constat</button></div>
  </form></div>`;
}

function renderLayer(){
  let h='';
  if(S.open){const c=constats.find(x=>x.id===S.open);if(c)h+=drawer(c)}
  if(S.modal)h+=modal();
  if(S.evalST)h+=evalModal();
  $('#layer').innerHTML=h;
}

/* ---------- actions ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}

function newId(){return 'C-0'+(seq++)}
function runSync(){
  if(S.syncing)return;S.syncing=true;S.syncStep=-1;render();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, dt=reduce?0:550;
  let i=0;const tick=()=>{S.syncStep=i;render();i++;if(i<4)setTimeout(tick,dt);else setTimeout(finish,dt)};
  setTimeout(tick,dt);
  function finish(){
    let n=0;
    pending.filter(f=>gabFam(f.gab)===S.mod).forEach(f=>{let made=0;
      f.items.forEach(it=>{if(it[1])return;const m=MAP.find(x=>x.gab===f.gab&&x.champ===it[0]);if(!m)return;
        const resp=it[2]||f.par;
        constats.push(C({id:newId(),type:m.type,projet:f.projet,lot:it[2]?ST[it[2]].lot:'Général',grav:m.grav,titre:it[0]+' : non. '+(it[3]||''),
          origine:'ACC Forms · '+f.gab,cree:d(0),auteur:f.par,resp,ech:d(GRAV[m.grav].delai),statut:'ouverte',
          journal:[{t:fmt(d(0)),txt:'Créé automatiquement par la synchro ('+f.acc+')'},{t:fmt(d(0)),txt:'Rappel envoyé à '+who(resp)}]}));made++;n++});
      if(f.gab==='Inspection SST hebdo')inspSST.faites++;
      synced.unshift({acc:f.acc,gab:f.gab,projet:f.projet,par:f.par,heure:nowHM(),crees:made});
    });
    pending=pending.filter(f=>gabFam(f.gab)!==S.mod);S.syncing=false;render();toast(n+' constat(s) créé(s) et assigné(s).');
  }
}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;if(a.tagName==='A')e.preventDefault();
  if(act==='nav')go(a.dataset.view);
  else if(act==='open'){S.open=a.dataset.id;renderLayer()}
  else if(act==='close'){S.open=null;renderLayer()}
  else if(act==='move'){
    const c=constats.find(x=>x.id===a.dataset.id),to=a.dataset.to,u=PEOPLE[S.role].nom;
    const msg={encours:c.statut==='averifier'?'Preuve refusée, à reprendre':'Pris en charge',averifier:'Preuve de correction déposée',fermee:'Fermeture validée'}[to];
    c.statut=to;c.journal.push({t:fmt(d(0)),txt:msg+' par '+u});
    if(to==='fermee'){c.fermePar=S.role;c.fermeLe=d(0)}
    render();toast(c.id+' : '+msg.toLowerCase()+'.');
  }
  else if(act==='sync')runSync();
  else if(act==='ssttab'){S.sstTab=a.dataset.tab;render()}
  else if(act==='mapfield'){MAP.push({gab:unknownField.gab,champ:unknownField.champ,nc:'Non',type:'sst',grav:'majeure',disc:'SST'});unknownField.open=false;render();toast('Champ relié. Les prochaines réponses « Non » créeront un écart SST majeur.')}
  else if(act==='pienew'){S.pieNew=true;render();setTimeout(()=>$('#pn-no')?.focus(),30)}
  else if(act==='pienewx'){S.pieNew=false;render()}
  else if(act==='piestep'){S.pieStep=+a.dataset.step;render()}
  else if(act==='pieopen'){S.pieOpen=S.pieOpen===a.dataset.id?null:a.dataset.id;render()}
  else if(act==='piedec'){const P=PIES[S.pieP],s=P.sel[a.dataset.id];s.dec=a.dataset.v;s.auto=false;if(s.dec==='Retenu')s.just='';render()}
  else if(act==='pietab'){S.pieTab=a.dataset.tab;render()}
  else if(act==='gabtab'){S.gabTab=a.dataset.tab;render()}
  else if(act==='gabopen'){S.gabOpen=S.gabOpen===a.dataset.id?null:a.dataset.id;render()}
  else if(act==='pieemit'){const P=PIES[S.pieP];if(P.revs.length&&!P.motif.trim()){toast('Inscris le motif de la révision avant d\'émettre.');return}
    P.etat='emis';P.date=d(0);P.revs.push({rev:P.rev,date:d(0),motif:P.revs.length?P.motif:'Émission initiale',par:S.role});P.motif='';S.pieTab='plan';render();toast('PIE '+P.rev+' émis pour '+P.proj+'. Les instances ACC seraient créées ici.')}
  else if(act==='pierev'){const P=PIES[S.pieP];P.etat='brouillon';P.rev='R'+String(P.revs.length).padStart(2,'0');S.pieStep=2;render();toast('Révision '+P.rev+' ouverte en brouillon.')}
  else if(act==='cmode'){const c=constats.find(x=>x.id===S.open);c.causeMode=a.dataset.m;renderLayer()}
  else if(act==='effok'||act==='effko'){const c=constats.find(x=>x.id===a.dataset.id),u=PEOPLE[S.role].nom;
    if(act==='effok'){c.eff='ok';c.journal.push({t:fmt(d(0)),txt:'Efficacité confirmée par '+u})}
    else{c.statut='ouverte';c.eff=null;c.fermePar=null;c.ech=d(GRAV[c.grav].delai);c.journal.push({t:fmt(d(0)),txt:'Non efficace, action rouverte par '+u})}
    render();toast(c.id+(act==='effok'?' : efficacité confirmée.':' rouvert.'))}
  else if(act==='abodel'){const c=constats.find(x=>x.id===S.open);c.abonnes=c.abonnes.filter(k=>k!==a.dataset.k);renderLayer()}
  else if(act==='evt'){S.evtOpen=a.dataset.id||null;render()}
  else if(act==='comptab'){S.compTab=a.dataset.tab;render()}
  else if(act==='eqdone'){const q=EQ.find(x=>x.id===a.dataset.id);q.dernier=d(0);q.prochain=d(q.freq);render();toast(q.id+' : fait aujourd\'hui, prochaine le '+fmt(q.prochain)+'.')}
  else if(act==='eval'){S.evalST=a.dataset.k;renderLayer()}
  else if(act==='closeeval'){S.evalST=null;renderLayer()}
  else if(act==='theme'){const r=document.documentElement,dark=r.dataset.theme!=='dark';r.dataset.theme=dark?'dark':'light';a.textContent=dark?'Mode jour':'Mode nuit'}
  else if(act==='new'){S.modal=true;draftPhoto=null;renderLayer();setTimeout(()=>$('#n-titre')?.focus(),30)}
  else if(act==='closemodal'){S.modal=false;renderLayer()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.evalST){S.evalST=null;renderLayer()}else if(S.modal){S.modal=false;renderLayer()}else if(S.open){S.open=null;renderLayer()}}
  if(e.key==='Enter'&&e.target.matches('tr[data-act="open"]')){S.open=e.target.dataset.id;renderLayer()}
  if(e.key==='Enter'&&e.target.matches('tr[data-act="evt"]')){S.evtOpen=e.target.dataset.id;render()}
  if(e.key==='Enter'&&e.target.matches('tr[data-act="gabopen"]')){S.gabOpen=S.gabOpen===e.target.dataset.id?null:e.target.dataset.id;render()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='role'){S.role=t.value;render();toast('Vue de '+PEOPLE[S.role].nom+', '+PEOPLE[S.role].role.toLowerCase())}
  else if(t.id==='devmode')document.body.classList.toggle('dev-on',t.checked);
  else if(t.id==='f-projet'){S.f.projet=t.value;render()}
  else if(t.id==='f-type'){S.f.type=t.value;render()}
  else if(t.id==='f-statut'){S.f.statut=t.value;render()}
  else if(t.id==='f-retard'){S.f.retard=t.checked;render()}
  else if(t.id==='pie-proj'){S.pieP=t.value;S.pieStep=1;S.pieOpen=null;render()}
  else if(t.dataset.pt){const P=PIES[S.pieP];P.ident[t.dataset.pt]=t.checked;Object.entries(TYPEDEP).forEach(([id,k])=>{if(k===t.dataset.pt&&P.sel[id].auto){P.sel[id].dec=t.checked?'Retenu':'Non applicable';P.sel[id].just=t.checked?'':'Ne s\'applique pas au type de projet'}});toast(t.checked?'Formulaires liés ajoutés à la sélection.':'Formulaires liés écartés de la sélection.')}
  else if(t.dataset.pc!=null){const P=PIES[S.pieP],v=t.dataset.pc;P.code=t.checked?[...P.code,v]:P.code.filter(x=>x!==v)}
  else if(t.dataset.pj||t.dataset.pr){render()}
  else if(t.id==='abo-add'&&t.value){const c=constats.find(x=>x.id===S.open);c.abonnes.push(t.value);c.journal.push({t:fmt(d(0)),txt:who(t.value)+' ajouté aux abonnés'});renderLayer()}
  else if(t.tagName==='SELECT'&&t.dataset.f&&S.open){const c=constats.find(x=>x.id===S.open);c[t.dataset.f]=t.value}
  else if(t.dataset.cost==='refact'){const c=constats.find(x=>x.id===S.open);c.cout.refact=t.checked;const el=document.getElementById('ct-'+c.id);if(el)el.textContent=costTxt(c)}
  else if(t.dataset.map){MAP[+t.dataset.map].grav=t.value;toast('Gravité mise à jour pour « '+MAP[+t.dataset.map].champ+' ».')}
  else if(t.id==='n-grav'){const g=GRAV[t.value];$('#n-ech').textContent='Échéance calculée : '+fmt(d(g.delai))+' ('+g.l.toLowerCase()+', '+g.delai+(g.delai>1?' jours':' jour')+')'}
  else if(t.id==='n-photo'&&t.files[0]){const r=new FileReader();r.onload=()=>draftPhoto=r.result;r.readAsDataURL(t.files[0])}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.pi){PIES[S.pieP].ident[t.dataset.pi]=t.value;return}
  if(t.dataset.pj){PIES[S.pieP].sel[t.dataset.pj].just=t.value;t.style.borderColor=t.value.trim()?'':'var(--bad)';return}
  if(t.dataset.pr){PIES[S.pieP].sel[t.dataset.pr].resp=t.value;return}
  if(t.dataset.pm){PIES[S.pieP].motif=t.value;return}
  if(!S.open)return;const c=constats.find(x=>x.id===S.open);if(!c)return;
  if(t.dataset.why!=null)c.causes[+t.dataset.why]=t.value;
  else if(t.dataset.six!=null)c.six[+t.dataset.six]=t.value;
  else if(t.dataset.f)c[t.dataset.f]=t.value;
  else if(t.dataset.cost==='h'||t.dataset.cost==='mat'){c.cout[t.dataset.cost]=Math.max(0,+t.value||0);const el=document.getElementById('ct-'+c.id);if(el)el.textContent=costTxt(c)}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='pienewf'){e.preventDefault();const no=$('#pn-no').value.trim(),nom=$('#pn-nom').value.trim();if(!no||!nom)return;
    if(PIES[no]){toast('Un PIE existe déjà pour '+no+'.');return}
    PROJ[no]={nom,acc:''};PIES[no]=newPie(no,{ident:{cp:'',sup:'',cq:PEOPLE[S.role].role==='Coordonnatrice CQ'?PEOPLE[S.role].nom:'A. Lavoie',client:'',lieu:'',secteurs:'',acier:false,murrideau:false}});
    S.pieP=no;S.pieStep=1;S.pieNew=false;render();toast('PIE '+no+' créé en brouillon. Commence par l\'identification.');return}
  if(e.target.id==='evalf'){e.preventDefault();const k=S.evalST;const n=CRIT.map((_,i)=>+$('#ev-'+i).value);
    EVALS[k]={date:d(0),moy:n.reduce((a,b)=>a+b,0)/n.length,par:S.role,com:$('#ev-com').value.trim()};S.evalST=null;render();toast('Évaluation enregistrée pour '+ST[k].nom+'.');return}
  if(e.target.id!=='newf')return;e.preventDefault();
  const g=$('#n-grav').value,resp=$('#n-resp').value,type=$('#n-type').value;
  const c=C({id:newId(),type,projet:$('#n-projet').value,lot:isST(resp)?ST[resp].lot:'Général',grav:g,titre:$('#n-titre').value.trim(),
    origine:'Saisie directe (mobile)',cree:d(0),auteur:S.role,resp:type==='obs'?null:resp,ech:type==='obs'?null:d(GRAV[g].delai),statut:type==='obs'?'fermee':'ouverte',photo:draftPhoto});
  if(type==='obs'){c.fermePar=S.role;c.fermeLe=d(0)}
  c.journal.push({t:fmt(d(0)),txt:'Créé par '+who(S.role)+' (saisie directe)'});
  if(c.resp)c.journal.push({t:fmt(d(0)),txt:'Rappel envoyé à '+who(c.resp)});
  constats.push(c);S.modal=false;S.open=c.id;render();toast(c.id+' créé.');
});

/* ---------- démarrage ---------- */
document.documentElement.dataset.theme='light'; /* mode jour forcé par défaut (charte Somtech) */
$('#role').innerHTML=ROLES.map(k=>`<option value="${k}">${PEOPLE[k].nom}, ${PEOPLE[k].role.toLowerCase()}</option>`).join('');
(function(){const h=(location.hash||'').slice(1);if(views().some(v=>v.k===h))S.view=h})();
render();
</script>
</body>
